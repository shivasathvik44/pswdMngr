[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultsync-desktop"
version = "0.9.0-beta.1"
description = "VaultSync Fedora Desktop Client (PySide6)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "VaultSync Team"}
]
dependencies = [
    "PySide6>=6.6.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
]

[project.scripts]
vaultsync-desktop = "vaultsync_desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
