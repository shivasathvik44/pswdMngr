name: Dependency Security & Vulnerability Scanning

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 4 * * 1" # Weekly every Monday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-server-dependencies:
    name: Audit Python Backend Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies and scanner
        run: |
          python -m pip install --upgrade pip
          pip install -e "server[dev]"
          pip install pip-audit

      - name: Run pip-audit and policy enforcement
        run: |
          mkdir -p reports
          audit_code=0
          pip-audit --format json --desc > reports/raw-server-audit.json || audit_code=$?
          if [ $audit_code -ne 0 ] && [ $audit_code -ne 1 ]; then
            echo "::error::pip-audit execution failed with exit code $audit_code"
          fi
          python scripts/vulnerability_scanner.py \
            --manifest server/pyproject.toml \
            --exceptions docs/security/vulnerability-exceptions.json \
            --fixture reports/raw-server-audit.json \
            --output-json reports/server-audit-report.json

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-dependency-audit-report
          path: reports/server-audit-report.json
          retention-days: 14

  audit-desktop-dependencies:
    name: Audit Python Desktop Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install desktop dependencies and scanner
        run: |
          python -m pip install --upgrade pip
          pip install -e "desktop[dev]"
          pip install pip-audit

      - name: Run pip-audit and policy enforcement
        run: |
          mkdir -p reports
          audit_code=0
          pip-audit --format json --desc > reports/raw-desktop-audit.json || audit_code=$?
          if [ $audit_code -ne 0 ] && [ $audit_code -ne 1 ]; then
            echo "::error::pip-audit execution failed with exit code $audit_code"
          fi
          python scripts/vulnerability_scanner.py \
            --manifest desktop/pyproject.toml \
            --exceptions docs/security/vulnerability-exceptions.json \
            --fixture reports/raw-desktop-audit.json \
            --output-json reports/desktop-audit-report.json

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-dependency-audit-report
          path: reports/desktop-audit-report.json
          retention-days: 14

  audit-android-dependencies:
    name: Audit Android Gradle Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Validate Gradle dependency graph resolution
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android app:dependencies --configuration releaseRuntimeClasspath
