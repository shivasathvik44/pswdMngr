name: Secret Scanning & Credential Leak Prevention

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * 1" # Weekly every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan-secrets:
    name: Audit & Prevent Credential Leaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Run Gitleaks Secret Scanner Action
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ".gitleaks.toml"

      - name: Run VaultSync Secret Scanner & Policy Enforcement
        run: |
          mkdir -p reports
          python scripts/secret_scanner.py \
            --scan-dir . \
            --config .gitleaks.toml \
            --output-json reports/secret-scan-report.json \
            --output-sarif reports/secret-scan.sarif

      - name: Upload Secret Scanning Audit Report Artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: secret-scanning-audit-report
          path: reports/secret-scan-report.json
          retention-days: 14

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/secret-scan.sarif
          category: secret-scanning
        continue-on-error: true
